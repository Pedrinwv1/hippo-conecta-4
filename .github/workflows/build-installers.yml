name: Build HIPPO CONECTA installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Install Android SDK packages
        shell: bash
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm ci
      - name: Generate Android project
        run: npx cap add android
      - name: Install image processing tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick librsvg2-bin
      - name: Configure Android permissions and launcher icon
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = path.read_text()
          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.POST_NOTIFICATIONS",
          ]
          for permission in permissions:
              tag = f'<uses-permission android:name="{permission}" />'
              if tag not in manifest:
                  manifest = manifest.replace("<application", f"    {tag}\n    <application", 1)
          def add_application_flags(match):
              attrs = match.group(1)
              if "android:hardwareAccelerated=" not in attrs:
                  attrs += ' android:hardwareAccelerated="true"'
              if "android:usesCleartextTraffic=" not in attrs:
                  attrs += ' android:usesCleartextTraffic="false"'
              return "<application" + attrs + ">"
          manifest = re.sub(r"<application\b([^>]*)>", add_application_flags, manifest, count=1)
          def add_activity_resize(match):
              tag = match.group(0)
              if "android:windowSoftInputMode=" not in tag:
                  tag = tag[:-1] + ' android:windowSoftInputMode="adjustResize">'
              return tag
          manifest = re.sub(
              r'<activity\b(?=[^>]*android:name="[^"]*MainActivity")[^>]*>',
              add_activity_resize,
              manifest,
              count=1
          )
          path.write_text(manifest)
          PY
          ICON="public/img/hippo-brand.svg"
          RES="android/app/src/main/res"
          if command -v magick >/dev/null 2>&1; then IMG=magick; else IMG=convert; fi
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            dir="$RES/mipmap-$density"
            mkdir -p "$dir"
            $IMG "$ICON" -resize "${size}x${size}" "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done
          for dir in "$RES"/mipmap-*; do
            [ -d "$dir" ] || continue
            if [ -f "$dir/ic_launcher_foreground.png" ]; then
              $IMG "$ICON" -resize 80% -gravity center -background none -extent 108x108 "$dir/ic_launcher_foreground.png"
            fi
          done
      - name: Sync app assets
        run: npm run android:sync
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HIPPO_CONECTA_5.7.0_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows-exe:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run build:css && npx electron-builder --win nsis --publish never
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: HIPPO_CONECTA_5.7.0_EXE
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish public HIPPO CONECTA 5.7.0 beta
    if: github.event_name == 'push' && github.event.head_commit.message == 'Launch HIPPO CONECTA 5.7.0 beta downloads'
    needs: [android-apk, windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK from this build
        uses: actions/download-artifact@v4
        with:
          name: HIPPO_CONECTA_5.7.0_APK
          path: release-files
      - name: Download Windows EXE from this build
        uses: actions/download-artifact@v4
        with:
          name: HIPPO_CONECTA_5.7.0_EXE
          path: release-files
      - name: Publish public beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.7.0
          name: HIPPO CONECTA 5.7.0 Beta
          prerelease: true
          generate_release_notes: true
          make_latest: false
          files: |
            release-files/*.apk
            release-files/*.exe
